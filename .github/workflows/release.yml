name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r skills/wechat-article-subscriber/requirements.txt
      - run: python -m pytest -q
      - run: python tools/validate_release.py
      - run: python tools/package_release.py
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
