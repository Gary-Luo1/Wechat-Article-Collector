<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="stitle sdesc">
  <title id="stitle">五维评分权重</title>
  <desc id="sdesc">技术深度 30%、信息新颖度 20%、分析深度与独立观点 25%、实用参考价值 15%、内容质量与可信度 10%。每项 1–10 分，缺一不可。</desc>

  <rect width="1200" height="400" rx="26" fill="#F6F8FA"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="24.5" fill="none" stroke="#D0D7DE" stroke-width="1.5"/>

  <text x="56" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, system-ui, sans-serif" font-size="28" font-weight="700" fill="#1F2328">五维评分</text>
  <text x="56" y="84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, system-ui, sans-serif" font-size="18" fill="#656D76">每维 1–10 · 加权合计 · 缺一不可</text>

  <rect x="56" y="108" width="1088" height="248" rx="16" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>

  <!-- label | weight | track(720) ; 30%=720 -->
  <g transform="translate(88 140)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1F2328">技术深度</text>
    <text x="300" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#656D76">30%</text>
    <rect x="320" y="6" width="720" height="24" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <rect x="320" y="6" width="720" height="24" rx="8" fill="#07C160"/>
  </g>

  <g transform="translate(88 186)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1F2328">分析深度与独立观点</text>
    <text x="300" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#656D76">25%</text>
    <rect x="320" y="6" width="720" height="24" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <rect x="320" y="6" width="600" height="24" rx="8" fill="#07C160"/>
  </g>

  <g transform="translate(88 232)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1F2328">信息新颖度</text>
    <text x="300" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#656D76">20%</text>
    <rect x="320" y="6" width="720" height="24" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <rect x="320" y="6" width="480" height="24" rx="8" fill="#07C160"/>
  </g>

  <g transform="translate(88 278)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1F2328">实用参考价值</text>
    <text x="300" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#656D76">15%</text>
    <rect x="320" y="6" width="720" height="24" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <rect x="320" y="6" width="360" height="24" rx="8" fill="#3370FF"/>
  </g>

  <g transform="translate(88 324)">
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, system-ui, sans-serif" font-size="20" font-weight="600" fill="#1F2328">内容质量与可信度</text>
    <text x="300" y="22" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#656D76">10%</text>
    <rect x="320" y="6" width="720" height="24" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/>
    <rect x="320" y="6" width="240" height="24" rx="8" fill="#3370FF"/>
  </g>
</svg>
